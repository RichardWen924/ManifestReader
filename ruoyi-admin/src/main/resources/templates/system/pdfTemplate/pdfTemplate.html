<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">

<head>
    <th:block th:include="include :: header('PDF模版列表')" />
</head>

<body class="gray-bg">
    <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>模版名称：</label>
                                <input type="text" name="templateName" />
                            </li>
                            <li>
                                <label>模版编码：</label>
                                <input type="text" name="templateCode" />
                            </li>
                            <li>
                                <label>创建者：</label>
                                <input type="text" name="createBy" />
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                        class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                        class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="system:pdfTemplate:add">
                    <i class="fa fa-plus"></i> 添加
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()"
                    shiro:hasPermission="system:pdfTemplate:edit">
                    <i class="fa fa-edit"></i> 修改
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()"
                    shiro:hasPermission="system:pdfTemplate:remove">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <a class="btn btn-info" onclick="toggleTestMode()">
                    <i class="fa fa-exchange"></i> <span id="testModeText">Dify测试模式: 关</span>
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:pdfTemplate:edit') }]];
        var removeFlag = [[${@permission.hasPermi('system:pdfTemplate:remove') }]];
        var prefix = ctx + "system/pdfTemplate";

        $(function () {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "PDF模版",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'templateId',
                    title: '模版ID',
                    visible: false
                },
                {
                    field: 'templateName',
                    title: '模版名称'
                },
                {
                    field: 'templateCode',
                    title: '模版编码'
                },
                {
                    field: 'createBy',
                    title: '创建者'
                },
                {
                    field: 'createTime',
                    title: '创建时间'
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function (value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.templateId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.templateId + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);

            // 初始化检查状态
            checkTestMode();
        });

        function checkTestMode() {
            $.ajax({
                url: ctx + "system/config/configKey/sys.dify.test.enabled",
                type: "GET",
                cache: false,
                success: function (result) {
                    console.log("Check Test Mode Result:", result);
                    if (result.code === 0) {
                        // 兼容处理：有时 result.data 可能是 boolean 或 string
                        var val = String(result.data).trim().toLowerCase();
                        var isTest = (val === 'true');
                        updateTestModeUI(isTest);
                    } else {
                        updateTestModeUI(false);
                    }
                },
                error: function (xhr) {
                    console.error("Check Test Mode Error:", xhr);
                }
            });
        }

        function updateTestModeUI(isTest) {
            console.log("Updating UI to:", isTest);
            var text = isTest ? "Dify测试模式: 开" : "Dify测试模式: 关";
            $("#testModeText").text(text);

            var btn = $("#testModeText").parent();
            if (isTest) {
                btn.removeClass("btn-info").addClass("btn-warning");
            } else {
                btn.removeClass("btn-warning").addClass("btn-info");
            }
        }

        function toggleTestMode() {
            // 先获取当前状态
            $.ajax({
                url: ctx + "system/config/configKey/sys.dify.test.enabled",
                type: "GET",
                cache: false,
                success: function (result) {
                    console.log("Current Status Result:", result);
                    var currentStatus = 'false';
                    if (result.code === 0 && result.data != null) {
                        currentStatus = String(result.data).trim().toLowerCase();
                    }

                    var newStatus = (currentStatus === 'true') ? 'false' : 'true';
                    console.log("Switching to:", newStatus);

                    // 保存新状态
                    saveConfig("sys.dify.test.enabled", newStatus);
                }
            });
        }

        function saveConfig(key, value) {
            $.ajax({
                url: ctx + "system/config/updateByKey",
                type: "POST",
                data: {
                    "configKey": key,
                    "configValue": value
                },
                success: function (result) {
                    console.log("Save Config Result:", result);
                    if (result.code === 0) {
                        updateTestModeUI(value === 'true');
                        $.modal.msgSuccess("切换成功");
                    } else {
                        $.modal.alertError("切换失败: " + result.msg);
                    }
                },
                error: function (xhr) {
                    $.modal.alertError("系统错误");
                }
            });
        }
    </script>
</body>

</html>
