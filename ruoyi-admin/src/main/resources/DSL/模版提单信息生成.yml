    - data:
        code: "import re\n\ndef main(arg1: str) -> dict:\n    # 1. 安全初始化，确保输入不为空\n\
          \    text = arg1 if arg1 else \"\"\n    \n    # -------------------------------------------------------\n\
          \    # 【彻底修复报错】移除反斜杠的正确姿势\n    # -------------------------------------------------------\n\
          \    text = text.replace(\"\\\\\", \"\")\n\n    # -------------------------------------------------------\n\
          \    # 【结构清洗】处理 HTML 标签和表格噪音\n    # -------------------------------------------------------\n\
          \    # 将 <br> 标签转换为换行符，确保联系方式不粘连\n    text = text.replace(\"<br>\", \"\\\
          n\")\n    # 将表格分隔符 | 转换为换行，强制模型“顺序读取”\n    text = text.replace(\"|\", \"\
          \\n\")\n    # 移除表格装饰线 (如 ---)\n    text = re.sub(r'[-: ]{3,}', '', text)\n\
          \n    # -------------------------------------------------------\n    # 【字段规范化】建立单号锚点\n\
          \    # -------------------------------------------------------\n    # 修复\
          \ B/L NO.\n    text = re.sub(r'(B/L\\s*NO\\.)\\s*', r'\\nB/L NO: ', text,\
          \ flags=re.IGNORECASE)\n    # 修复 DOC. NO.\n    text = re.sub(r'(DOC\\.?\\\
          s*NO\\.)\\s*', r'\\nDOC NO: ', text, flags=re.IGNORECASE)\n    # 修复 BOOKING\
          \ NO.\n    text = re.sub(r'(BOOKING\\.?\\s*NO\\.)\\s*', r'\\nBOOKING NO:\
          \ ', text, flags=re.IGNORECASE)\n\n    # -------------------------------------------------------\n\
          \    # 【除去干扰】清理多余空白\n    # -------------------------------------------------------\n\
          \    # 移除连续 3 个及以上的换行，保持紧凑\n    text = re.sub(r'\\n{3,}', '\\n\\n', text)\n\
          \    \n    # 最终清理每一行的首尾空格，并过滤掉空行\n    lines = [line.strip() for line in\
          \ text.split('\\n') if line.strip()]\n    cleaned_text = '\\n'.join(lines)\n\
          \n    return {\n        \"result\": cleaned_text\n    }"
