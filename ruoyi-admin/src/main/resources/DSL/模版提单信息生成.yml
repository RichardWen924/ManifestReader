            正本提单份数\" },\n    { \"original_text\": \"{{issue_place}}\", \"placeholder_key\"\
            : \"issue_place\", \"data_type\": \"string\", \"description\": \"签发地\"\
            \ },\n    { \"original_text\": \"{{laden_on_board}}\", \"placeholder_key\"\
            : \"laden_on_board\", \"data_type\": \"string\", \"description\": \"装船日期\"\
            \ }\n  ]\n}"
        - id: 757a2af6-2933-4eee-8e64-deeb6463b003
          role: user
          text: '# Task

            深度分析以下提单内容，将所有提取到的业务数据填入 JSON 模版的 {{}} 位置。


            # Input Content

            {{#1770954236007.result#}}


            # High-Precision Extraction Instructions

            1. **数值原子化**：严禁将重量和体积放在同一个字段。`gross_weight_kgs` 只能是重量数值（如 8492），`measurement_cbm`
            只能是体积数值（如 68）。

            2. **文档号修正**：识别 "DOC. NO." 后面的字符串作为 doc_no。

            3. **联系方式贪婪提取**：针对 Notify Party 和 Delivery Agent，必须提取到最后一行出现的 Email 地址。

            4. **Agent 锁定**：精准抓取 "on behalf of" 之后的公司全称作为 carrier_agent。

            5、包装件数package_quantity为仅数字，如果有carton就将单位删除

            6、读取时将freight_term前面的freight也读取进入字段


            请直接返回填充后的 JSON result。'
