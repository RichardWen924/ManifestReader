            , \"description\": \"体积\" },\n    { \"original_text\": \"{{container_weight1}}\"\
            , \"placeholder_key\": \"container_weight\", \"data_type\": \"string\"\
            , \"description\": \"箱重\" },\n    { \"original_text\": \"{{VGM}}\", \"\
            placeholder_key\": \"vgm_weight\", \"data_type\": \"string\", \"description\"\
            : \"VGM重量\" },\n    { \"original_text\": \"{{serial_no}}\", \"placeholder_key\"\
