<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:include="include :: header('新增PDF模版')" />
    <th:block th:include="include :: jasny-bootstrap-css" />
</head>

<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-pdfTemplate-add" enctype="multipart/form-data">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">模版名称：</label>
                <div class="col-sm-8">
                    <input name="templateName" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">模版编码：</label>
                <div class="col-sm-8">
                    <input name="templateCode" class="form-control" type="text" required placeholder="唯一标识，建议使用英文">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">模版文件：</label>
                <div class="col-sm-8">
                    <div class="fileinput fileinput-new" data-provides="fileinput">
                        <div class="fileinput-preview thumbnail" data-trigger="fileinput"
                            style="width: 200px; height: 150px;"></div>
                        <div>
                            <span class="btn btn-white btn-file"><span class="fileinput-new">选择文件</span><span
                                    class="fileinput-exists">更改</span><input type="file" name="file" required
                                    accept=".docx"></span>
                            <a href="#" class="btn btn-white fileinput-exists" data-dismiss="fileinput">清除</a>
                        </div>
                    </div>
                    <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> 请上传 .docx 格式的模版文件</span>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: jasny-bootstrap-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/pdfTemplate"
        $("#form-pdfTemplate-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                var formData = new FormData($("#form-pdfTemplate-add")[0]);
                $.ajax({
                    url: prefix + "/add",
                    type: 'post',
                    cache: false,
                    data: formData,
                    processData: false,
                    contentType: false,
                    dataType: "json",
                    success: function (result) {
                        $.operate.successCallback(result);
                    }
                });
            }
        }
    </script>
</body>

</html>
