<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:include="include :: header('修改公司用户')" />
</head>

<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-user-edit" th:object="${sysCompanyUser}">
            <input name="userId" th:field="*{userId}" type="hidden">
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">公司名：</label>
                    <div class="col-sm-8">
                        <input name="companyName" th:field="*{companyName}" class="form-control" type="text" required>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">公司编号 (对应业务表 create_by)：</label>
                    <div class="col-sm-8">
                        <input name="companyCode" th:field="*{companyCode}" class="form-control" type="text" required>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">公司四字缩写 (对应docNo前四位)：</label>
                    <div class="col-sm-8">
                        <input name="companyAbbr" th:field="*{companyAbbr}" class="form-control" type="text" required>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">密码 (建议加密存储)：</label>
                    <div class="col-sm-8">
                        <input name="password" th:field="*{password}" class="form-control" type="text" required>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">业务数据量 (系统自动计算)：</label>
                    <div class="col-sm-8">
                        <input name="dataCount" th:field="*{dataCount}" class="form-control" type="text" readonly>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">帐号状态：</label>
                    <div class="col-sm-8">
                        <div class="radio-box">
                            <input type="radio" id="status0" name="status" value="0" th:field="*{status}">
                            <label for="status0">正常</label>
                        </div>
                        <div class="radio-box">
                            <input type="radio" id="status1" name="status" value="1" th:field="*{status}">
                            <label for="status1">停用</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">会员状态：</label>
                    <div class="col-sm-8">
                        <div class="radio-box">
                            <input type="radio" id="vip0" name="vipStatus" value="0" th:field="*{vipStatus}">
                            <label for="vip0">普通</label>
                        </div>
                        <div class="radio-box">
                            <input type="radio" id="vip1" name="vipStatus" value="1" th:field="*{vipStatus}">
                            <label for="vip1">会员</label>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "system/user";
        $("#form-user-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-user-edit').serialize());
            }
        }
    </script>
</body>

</html>
