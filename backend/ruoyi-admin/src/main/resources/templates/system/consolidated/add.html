<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:include="include :: header('新增订舱与集装箱合并信息')" />
    <th:block th:include="include :: bootstrap-fileinput-css" />
    <style>
        #pdf-container {
            position: relative;
            width: 100%;
            overflow: auto;
            border: 1px solid #ccc;
            display: none;
            /* 默认隐藏 */
        }

        .pdf-canvas {
            display: block;
            margin: 0 auto;
        }

        .input-overlay {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #007bff;
            color: black;
            font-size: 12px;
            z-index: 10;
        }

        .ai-btn-group {
            margin-top: 10px;
        }
    </style>
    <!-- 引入 PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
</head>

<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <!-- 标准表单区域 -->
        <form class="form-horizontal m" id="form-consolidated-add">
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">文件存储路径：</label>
                    <div class="col-sm-8">
                        <input type="hidden" name="filePath" id="filePathInput">
                        <div class="file-loading">
                            <input class="form-control file-upload" id="filePath" name="file" type="file">
                        </div>
                        <div class="ai-btn-group">
                            <button type="button" class="btn btn-primary" onclick="startAIAnalysis()">
                                <i class="fa fa-magic"></i> AI 智能提取与校对
                            </button>
                            <button type="button" class="btn btn-success" onclick="submitHandler()">
                                <i class="fa fa-save"></i> 普通保存
                            </button>
                            <button type="button" class="btn btn-danger" onclick="closeItem()">
                                <i class="fa fa-close"></i> 关闭
                            </button>
                            <span class="help-block m-b-none"><i class="fa fa-info-circle"></i>
                                请点击上方 AI 按钮进行智能校对；若不需要 AI，请确认文件上传后点击页面中出现的保存按钮。</span>
                        </div>
                    </div>
                </div>
            </div>
        </form>

        <!-- AI 校对区域 (默认隐藏) -->
        <div id="ai-review-area" style="display:none; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px;">
            <h3>AI 智能提取校对</h3>
            <!-- 校验错误边栏提示区 -->
            <div id="validation-summary-bar" class="alert alert-danger" style="display:none; margin-bottom: 15px;">
                <i class="fa fa-warning"></i> <strong>请重新输入：</strong> 以下字段输入不合法，请根据提示修正后再保存。
                <ul id="validation-error-list" style="margin-top: 5px; margin-bottom: 0;"></ul>
            </div>
            <div class="row">
                <div class="col-sm-12">
                    <div class="btn-group pull-right">
                        <button type="button" class="btn btn-primary" onclick="exportPdfOnly()">
                            <i class="fa fa-file-pdf-o"></i> 仅导出PDF
                        </button>
                        <button type="button" class="btn btn-success" onclick="confirmAIResult()">
                            <i class="fa fa-save"></i> 确定保存
                        </button>
                        <button type="button" class="btn btn-danger" onclick="cancelAIReview()">
                            <i class="fa fa-close"></i> 取消
                        </button>
                    </div>
                </div>
            </div>
            <div id="pdf-container">
                <!-- Canvas 和 Input 会动态插入这里 -->
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: bootstrap-fileinput-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/consolidated"
        var currentUuid = null;
        var currentScale = 1.5; // PDF 渲染缩放比例
        var originalBusinessData = null; // 存储原始业务数据

        $("#form-consolidated-add").validate({
            focusCleanup: true
        });

        $(function () {
            // 隐藏弹窗默认的右下角按钮
            var index = parent.layer.getFrameIndex(window.name);
            parent.$("#layui-layer" + index).find(".layui-layer-btn").hide();
        });

        // 1. 普通保存 (修改为询问模式)
        function submitHandler() {
            if ($.validate.form()) {
                var filePath = $("#filePathInput").val();
                if (!filePath) {
                    $.modal.alertWarning("请先上传文件！");
                    return;
                }

                layer.confirm('确认保存并导出PDF吗？', {
                    btn: ['保存并导出PDF', '仅保存', '取消']
                }, function (index) {
                    doSave(true, filePath, {});
                    layer.close(index);
                }, function (index) {
                    doSave(false, filePath, {});
                    layer.close(index);
                });
            }
        }

        function doSave(exportPdf, filePath, editedData) {
            $.modal.loading("正在保存数据...");
            var requestData = {
                filePath: filePath,
                editedData: editedData
            };

            $.ajax({
                url: prefix + "/add",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(requestData),
                success: function (result) {
                    if (result.code == 200 || result.code == 0) {
                        if (exportPdf) {
                            // 调用导出PDF逻辑 (暂存数据需要从 editedData 获取)
                            exportPdfSilently(editedData);
                        } else {
                            $.modal.closeLoading();
                            $.modal.msgSuccess("保存成功");
                            setTimeout(function () {
                                var index = parent.layer.getFrameIndex(window.name);
                                parent.layer.close(index);
                                parent.location.reload();
                            }, 1000);
                        }
                    } else {
                        $.modal.closeLoading();
                        $.modal.alertError(result.msg || "保存失败");
                    }
                },
                error: function () {
                    $.modal.closeLoading();
                    $.modal.alertError("网络错误，请重试");
                }
            });
        }

        // 2. 文件上传处理
        $(".file-upload").fileinput({
            uploadUrl: ctx + 'common/upload',
            maxFileCount: 1,
            autoReplace: true
        }).on('fileuploaded', function (event, data, previewId, index) {
            $("#filePathInput").val(data.response.url);
        }).on('fileremoved', function (event, id, index) {
            $("#filePathInput").val('');
        });

        // 3. 开始 AI 分析
        function startAIAnalysis() {
            var filePath = $("#filePathInput").val();
            if (!filePath) {
                $.modal.alertWarning("请先上传文件！");
                return;
            }

            var config = {
                url: prefix + "/analyze",
                type: "post",
                dataType: "json",
                data: { "filePath": filePath },
                beforeSend: function () {
                    $.modal.loading("正在进行 AI 智能提取，请稍候...");
                },
                success: function (result) {
                    $.modal.closeLoading();
                    if (result.code == 0) {
                        showAIReview(result.data, filePath);
                    } else {
                        $.modal.alertError(result.msg);
                    }
                }
            };
            $.ajax(config);
        }

        // 4. 显示 AI 校对界面
        function showAIReview(dto, filePath) {
            console.log("收到 DTO 数据:", dto);
            console.log("字段坐标数量:", dto.fieldLocations ? Object.keys(dto.fieldLocations).length : 0);
            console.log("业务数据:", dto.businessData);

            currentUuid = dto.uuid;
            originalBusinessData = dto.businessData; // 保存原始完整数据
            $("#ai-review-area").show();
            $("#form-consolidated-add").hide(); // 隐藏原表单

            // 渲染 PDF 和 输入框
            renderPdfWithOverlays(filePath, dto);
        }

        // 5. 渲染 PDF 和 数据编辑表单
        async function renderPdfWithOverlays(url, dto) {
            var container = document.getElementById('pdf-container');
            container.innerHTML = ''; // 清空
            container.style.display = 'block';

            var locations = dto.fieldLocations || {};
            var data = dto.businessData || {};

            console.log("开始渲染，字段坐标数量:", Object.keys(locations).length);
            console.log("业务数据:", data);

            // 尝试渲染PDF（可选，失败也不影响表单显示）
            try {
                if (url && typeof pdfjsLib !== 'undefined') {
                    var pdfUrl = url;
                    var loadingTask = pdfjsLib.getDocument(pdfUrl);
                    var pdf = await loadingTask.promise;
                    var page = await pdf.getPage(1);
                    var viewport = page.getViewport({ scale: currentScale });

                    var canvasWrapper = document.createElement('div');
                    canvasWrapper.style.position = 'relative';
                    canvasWrapper.style.width = viewport.width + 'px';
                    canvasWrapper.style.height = viewport.height + 'px';
                    canvasWrapper.style.margin = '0 auto';

                    var canvas = document.createElement('canvas');
                    canvas.className = 'pdf-canvas';
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({
                        canvasContext: canvas.getContext('2d'),
                        viewport: viewport
                    }).promise;

                    canvasWrapper.appendChild(canvas);
                    container.appendChild(canvasWrapper);
                    console.log("PDF渲染成功");
                }
            } catch (e) {
                console.warn("PDF渲染失败，但不影响字段编辑:", e);
            }

            // 始终显示表单编辑区域
            var formHtml = '<div class="panel panel-default" style="margin: 20px;">';
            formHtml += '<div class="panel-heading"><h4>数据编辑</h4></div>';
            formHtml += '<div class="panel-body"><form class="form-horizontal">';


            // 字段名称映射（根据bill_of_lading_v5数据库表结构）
            var fieldLabels = {
                'blNo': 'B/L NO.', 'bookingNo': 'BOOKING NO.', 'docNo': 'DOC. NO.', 'serialNo': 'SERIAL NO.',
                'shipper': 'SHIPPER 发货人', 'consignee': 'CONSIGNEE 收货人', 'notifyParty': 'NOTIFY PARTY 通知方',
                'carrierAgent': 'CARRIER AGENT 承运人代理', 'deliveryAgent': 'DELIVERY AGENT 交货代理',
                'preCarriageBy': 'PRE-CARRIAGE BY 前段运输',
                'vesselVoyage': 'VESSEL/VOYAGE 船名航次', 'placeOfReceipt': 'PLACE OF RECEIPT 收货地',
                'portOfLoading': 'PORT OF LOADING 装货港', 'portOfDischarge': 'PORT OF DISCHARGE 卸货港',
                'placeOfDelivery': 'PLACE OF DELIVERY 交货地',
                'containerNo': 'CONTAINER NO. 箱号', 'sealNo': 'SEAL NO. 封号',
                'containerWeight': 'CONTAINER WEIGHT 箱重', 'vgmWeight': 'VGM WEIGHT VGM重',
                'containerSealInfo': 'CONTAINER/SEAL 集装箱封条',
                'packageQuantity': 'QUANTITY 件数', 'packageUnit': 'PACKAGE UNIT 包装单位',
                'goodsDescription': 'GOODS DESCRIPTION 货物描述', 'grossWeightKgs': 'GROSS WEIGHT(KGS) 毛重',
                'measurementCbm': 'MEASUREMENT(CBM) 体积', 'serviceType': 'SERVICE TYPE 服务类型',
                'serviceMode': 'SERVICE MODE 服务模式',
                'revenueTons': 'REVENUE TONS 计费吨', 'freightTerm': 'FREIGHT TERM 运费条款',
                'freightRate': 'RATE 费率', 'prepaidAmount': 'PREPAID 预付', 'collectAmount': 'COLLECT 到付',
                'payableAt': 'PAYABLE AT 支付地', 'originalBlCount': 'ORIGINAL B/L COUNT 正本份数',
                'issuePlace': 'PLACE OF ISSUE 签发地', 'ladenOnBoard': 'LADEN ON BOARD 装船批注',
                'marks': 'MARKS 唛头'
            };
            var textAreaFields = ['shipper', 'consignee', 'notifyParty', 'deliveryAgent', 'goodsDescription', 'ladenOnBoard', 'marks', 'description'];
            var fieldOrder = ['blNo', 'bookingNo', 'serialNo', 'shipper', 'consignee', 'notifyParty', 'carrierAgent', 'deliveryAgent', 'preCarriageBy', 'vesselVoyage', 'placeOfReceipt', 'portOfLoading', 'portOfDischarge', 'placeOfDelivery', 'containerNo', 'sealNo', 'containerWeight', 'vgmWeight', 'containerSealInfo', 'packageQuantity', 'packageUnit', 'goodsDescription', 'marks', 'grossWeightKgs', 'measurementCbm', 'serviceType', 'serviceMode', 'revenueTons', 'freightTerm', 'freightRate', 'prepaidAmount', 'collectAmount', 'payableAt', 'originalBlCount', 'issuePlace', 'ladenOnBoard'];

            for (var i = 0; i < fieldOrder.length; i++) {
                var k = fieldOrder[i];
                var label = fieldLabels[k];
                if (!label) continue;
                var value = data[k] || '';
                formHtml += '<div class="form-group">';
                formHtml += '<label class="col-sm-3 control-label">' + label + ':</label>';
                formHtml += '<div class="col-sm-8">';
                if (textAreaFields.indexOf(k) !== -1) {
                    formHtml += '<textarea class="form-control field-input" data-key="' + k + '" rows="4">' + value + '</textarea>';
                } else {
                    formHtml += '<input type="text" class="form-control field-input" data-key="' + k + '" value="' + value + '">';
                }
                formHtml += '<span class="help-block m-b-none error-msg text-danger" style="display:none;"></span>';
                formHtml += '</div></div>';
            }
            formHtml += '</form></div></div>';
            $(container).append(formHtml);
            console.log("字段渲染完成，共", Object.keys(data).length - 2, "个字段");
        }

        // 实时校验单元函数
        function validateSingleField($input) {
            var key = $input.data("key");
            var val = $input.val();
            var fieldError = null;

            if ((key === 'blNo' || key === 'bookingNo') && !val) {
                fieldError = "该字段不能为空";
            } else if (val) {
                if (['grossWeightKgs', 'measurementCbm', 'containerWeight', 'vgmWeight'].indexOf(key) !== -1) {
                    // 使用正则检测纯数字/小数，避免 parseFloat("100abc") 返回 100 的弱性质
                    if (!/^-?\d*\.?\d+$/.test(val)) {
                        fieldError = "应填数据类型：有效数字 (如 12.34)";
                    }
                } else if (key === 'packageQuantity') {
                    if (!/^\d+$/.test(val)) {
                        fieldError = "应填数据类型：整数 (如 100)";
                    }
                }
            }

            var $group = $input.closest(".form-group");
            var $error = $input.next(".error-msg");
            if (fieldError) {
                $group.addClass("has-error");
                $error.text(fieldError).show();
            } else {
                $group.removeClass("has-error");
                $error.hide().text("");
            }
            updateSummaryBar();
        }

        // 更新顶部错误汇总栏
        function updateSummaryBar() {
            var errors = [];
            $(".field-input").each(function () {
                var $input = $(this);
                if ($input.closest(".form-group").hasClass("has-error")) {
                    var key = $input.data("key");
                    var label = fieldLabels[key] || key;
                    var msg = $input.next(".error-msg").text();
                    errors.push("<li><strong>" + label + "</strong>: " + msg + "</li>");
                }
            });

            if (errors.length > 0) {
                $("#validation-error-list").html(errors.join(""));
                $("#validation-summary-bar").show();
            } else {
                $("#validation-summary-bar").hide();
                $("#validation-error-list").empty();
            }
        }

        // 绑定动态事件监听
        $(document).on('input', '.field-input', function () {
            validateSingleField($(this));
        });

        // 6. 确认并保存到数据库（修改为询问模式）
        function confirmAIResult() {
            if (!currentUuid) {
                $.modal.alertWarning("会话已失效");
                return;
            }
            if (!originalBusinessData) {
                $.modal.alertWarning("原始数据丢失，请重新分析");
                return;
            }

            // 全量校验一次
            var hasError = false;
            $(".field-input").each(function () {
                validateSingleField($(this));
                if ($(this).closest(".form-group").hasClass("has-error")) {
                    hasError = true;
                }
            });

            if (hasError) {
                // 滚动到顶部错误栏
                $('html, body').animate({
                    scrollTop: $("#validation-summary-bar").offset().top - 20
                }, 300);
                return;
            }

            // 收集数据
            var updatedData = $.extend(true, {}, originalBusinessData);
            $(".field-input").each(function () {
                updatedData[$(this).data("key")] = $(this).val();
            });

            console.log("准备保存的数据:", updatedData);

            layer.confirm('已经完成校对，确认保存吗？是否同步导出PDF？', {
                btn: ['保存并导出PDF', '仅保存', '取消']
            }, function (index) {
                doSaveToDb(true, updatedData);
                layer.close(index);
            }, function (index) {
                doSaveToDb(false, updatedData);
                layer.close(index);
            });
        }

        function doSaveToDb(exportPdf, updatedData) {
            $.modal.loading("正在保存数据...");
            var postData = {
                uuid: currentUuid,
                businessData: updatedData
            };

            $.ajax({
                url: prefix + "/save-to-db",
                type: "post",
                contentType: "application/json",
                data: JSON.stringify(postData),
                success: function (result) {
                    if (result.code == 200 || result.code == 0) {
                        if (exportPdf) {
                            exportPdfSilently(updatedData);
                        } else {
                            $.modal.closeLoading();
                            $.modal.msgSuccess("数据保存成功");
                            setTimeout(function () {
                                location.href = ctx + "system/consolidated";
                            }, 1000);
                        }
                    } else {
                        $.modal.closeLoading();
                        $.modal.alertError(result.msg || "保存失败");
                    }
                },
                error: function () {
                    $.modal.closeLoading();
                    $.modal.alertError("网络错误，请重试");
                }
            });
        }

        function exportPdfSilently(updatedData) {
            var dto = {
                uuid: currentUuid,
                businessData: updatedData
            };

            var xhr = new XMLHttpRequest();
            xhr.open('POST', prefix + "/export-pdf-only", true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.responseType = 'blob';

            xhr.onload = function () {
                $.modal.closeLoading();
                if (xhr.status === 200) {
                    var blob = xhr.response;
                    var url = window.URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = 'BL_' + (updatedData.bookingNo || Date.now()) + '.pdf';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);

                    $.modal.msgSuccess("保存成功并开始下载PDF");
                    setTimeout(function () {
                        location.href = ctx + "system/consolidated";
                    }, 1500);
                } else {
                    $.modal.alertError("导出PDF失败");
                }
            };
            xhr.send(JSON.stringify(dto));
        }

        // 7. 仅导出PDF（不保存到数据库）
        function exportPdfOnly() {
            if (!currentUuid) {
                $.modal.alertWarning("会话已失效");
                return;
            }

            if (!originalBusinessData) {
                $.modal.alertWarning("无法获取原始数据");
                return;
            }

            // 收集用户编辑后的数据
            var updatedData = $.extend(true, {}, originalBusinessData);
            $(".field-input").each(function () {
                var key = $(this).data("key");
                var value = $(this).val();
                if (key) {
                    updatedData[key] = value;
                }
            });

            console.log("仅导出PDF，更新数据:", updatedData);

            var dto = {
                uuid: currentUuid,
                businessData: updatedData
            };

            // 使用XMLHttpRequest处理二进制响应
            $.modal.loading("正在生成PDF，请稍候...");

            var xhr = new XMLHttpRequest();
            xhr.open('POST', prefix + "/export-pdf-only", true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.responseType = 'blob'; // 关键：设置响应类型为blob

            xhr.onload = function () {
                $.modal.closeLoading();

                if (xhr.status === 200) {
                    // 检查响应类型
                    if (xhr.response.type === 'application/pdf') {
                        // 创建blob URL并触发下载
                        var blob = xhr.response;
                        var url = window.URL.createObjectURL(blob);
                        var a = document.createElement('a');
                        a.style.display = 'none';
                        a.href = url;

                        // 生成文件名（使用bookingNo或时间戳）
                        var fileName = 'BL_' + (updatedData.bookingNo || Date.now()) + '.pdf';
                        a.download = fileName;

                        document.body.appendChild(a);
                        a.click();

                        // 清理
                        window.URL.revokeObjectURL(url);
                        document.body.removeChild(a);

                        $.modal.msgSuccess("PDF生成成功并开始下载");
                    } else if (xhr.response.type === 'application/json') {
                        // 如果返回的是JSON（错误信息）
                        var reader = new FileReader();
                        reader.onload = function () {
                            var result = JSON.parse(reader.result);
                            $.modal.alertError(result.msg || "PDF生成失败");
                        };
                        reader.readAsText(xhr.response);
                    }
                } else {
                    $.modal.alertError("PDF生成失败，HTTP状态码: " + xhr.status);
                }
            };

            xhr.onerror = function () {
                $.modal.closeLoading();
                $.modal.alertError("网络错误，PDF生成失败");
            };

            xhr.send(JSON.stringify(dto));
        }

        function cancelAIReview() {
            // 只隐藏AI审查区域，保留编辑界面
            // $("#ai-review-area").hide();
            // $("#form-consolidated-add").show();

            // 不清除数据，用户可以继续编辑
            // currentUuid = null;
            // originalBusinessData = null;

            // 简单提示用户
            $.modal.msg("已取消，您可以继续编辑或关闭窗口");
        }

        function closeItem() {
            var index = parent.layer.getFrameIndex(window.name);
            parent.layer.close(index);
        }
    </script>
</body>

</html>
